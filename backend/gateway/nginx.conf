events {}

http {
  # Docker's embedded DNS. Required because the service names below are
  # resolved through a VARIABLE in each proxy_pass, not through an `upstream`
  # block -- and that indirection is the whole point:
  #
  # nginx resolves a hostname in an `upstream` block (or a literal
  # proxy_pass) exactly once, at config load, and caches the IP for the life
  # of the worker. Recreating a service container gives it a new IP on the
  # compose network, and the gateway then proxies to the dead one forever:
  #
  #   connect() failed (111: Connection refused) while connecting to
  #   upstream, upstream: "http://172.18.0.2:3000/api/signin"
  #
  # while `wget http://core-api:3000/...` from inside this same container
  # answers correctly. Every `docker compose up -d` of an app service used to
  # need a `restart gateway` chaser to clear it. With a variable, nginx
  # re-resolves per request and honours the `valid=` TTL instead.
  #
  # ipv6=off because Docker's resolver returns no AAAA records here and the
  # lookup just costs a round-trip.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;

    # Security headers, applied to every proxied response.
    #
    # `always` matters: without it nginx drops these on error responses
    # (4xx/5xx), which are exactly the responses an injected payload is most
    # likely to ride on.
    #
    # The CSP is the defence-in-depth layer behind the frontend's own
    # `safeExternalUrl()` guard — that stops a `javascript:` URL reaching an
    # `href`, and this stops one executing if a future sink slips past it.
    # Scoped to what the app actually loads:
    #   - `script-src 'self'`: no inline scripts. Vite's production build
    #     emits external module scripts only, so no 'unsafe-inline' is
    #     needed. Do NOT add it back to fix a dev-mode error — dev is served
    #     by Vite, not by this proxy.
    #   - `style-src` needs 'unsafe-inline': Tailwind v4 and the Radix
    #     primitives set inline styles at runtime (positioning, transforms),
    #     and there is no nonce plumbing for them.
    #   - `img-src` needs `data:` — the PDF/email templates embed the company
    #     logo as a data: URI, and the UI renders those previews.
    #   - `connect-src 'self'`: the frontend only ever calls this gateway.
    #   - `frame-ancestors 'none'` + X-Frame-Options: this CRM is never meant
    #     to be embedded, and clickjacking a loan-approval button is a real
    #     concern.
    #   - `object-src 'none'`, `base-uri 'self'`: no plugins, and no
    #     injected <base> redirecting relative URLs.
    # Lottie animations are same-origin files under /public, so 'self'
    # already covers them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Opt out of Chrome's legacy feature set the CRM never uses.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # FOOTGUN: nginx's `add_header` is not additive across levels — a
    # `location` block that declares ANY `add_header` of its own silently
    # discards every one inherited from here. The location blocks below use
    # only `proxy_set_header` (a different directive, sets REQUEST headers),
    # so inheritance currently holds. If you ever add a response
    # `add_header` to a location, you must re-declare all of the above in it.
    #
    # NOTE: HSTS is deliberately NOT set here. This server block listens on
    # plain :80 and TLS terminates upstream (ALB), so the header belongs
    # wherever HTTPS is actually served — setting it on an http listener is
    # either ignored or, worse, latches a browser onto https for a host that
    # may not serve it in dev.

    location /api/v1/integrations/ {
      # $request_uri is mandatory with a variable upstream: nginx only
      # forwards the original URI automatically for the literal form.
      set $integrations_upstream integrations-api;
      proxy_pass http://$integrations_upstream:3001$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }

    location /api/v1/reporting/ {
      set $reporting_upstream reporting-api;
      proxy_pass http://$reporting_upstream:3002$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }

    location / {
      set $core_upstream core-api;
      proxy_pass http://$core_upstream:3000$request_uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cookie_path / /;
    }
  }
}
